; llama.cpp router preset for a 4 GB GPU. The section name becomes the model id in Pi.
; Start:  llama serve --models-preset qwen3.5-4b.ini --host 127.0.0.1 --port 9931
; (Windows prebuilt: .\llama-server.exe --models-preset qwen3.5-4b.ini --host 127.0.0.1 --port 9931)
; Keys are llama-server long options without the leading dashes; valueless flags are written "= true".
version = 1

[qwen3.5-4b]
load-on-startup = true
; IQ4_XS (~2.7 GB) leaves room for the KV cache on 4 GB. Q4_K_M (~3.0 GB) is tighter; check the repo's file list.
hf-repo = bartowski/Qwen_Qwen3.5-4B-GGUF
hf-file = Qwen_Qwen3.5-4B-IQ4_XS.gguf
; Text only: skip the vision projector to save VRAM.
no-mmproj = true
; 32K is a workable agent context. Drop to 16384 if the load fails or spills to CPU.
ctx-size = 32768
parallel = 1
; Offload every layer to the GPU.
ngl = 999
; Use the model's own chat template, which carries its tool-call format.
jinja = true
; Quantised KV cache roughly halves its VRAM at a small quality cost.
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
